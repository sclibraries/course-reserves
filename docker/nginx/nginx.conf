# Rate limiting zone for auth endpoints (5 req/min per IP, burst of 3)
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

map $http_origin $folio_cors_origin {
    default "";
    "http://localhost:5173" "http://localhost:5173";
    "http://localhost:5174" "http://localhost:5174";
    "http://127.0.0.1:5173" "http://127.0.0.1:5173";
    "http://127.0.0.1:5174" "http://127.0.0.1:5174";
    "http://localhost:8080" "http://localhost:8080";
}

map "${FOLIO_UPSTREAM}" $folio_proxy {
    default https://libtools2.smith.edu;
    fake    http://fake-folio:3000;
}

map "${FOLIO_UPSTREAM}" $folio_host {
    default libtools2.smith.edu;
    fake    fake-folio:3000;
}

server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend;
    set $frontend_upstream http://frontend:5173;
    set $faculty_form_upstream http://faculty-form:5174;
    set $folio_mode "${FOLIO_UPSTREAM}";
    set $fake_folio_upstream http://fake-folio:3000;

    # ─── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://kit.fontawesome.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://kit.fontawesome.com https://ka-f.fontawesome.com; connect-src 'self' ws://localhost:5173 ws://localhost:5174 https://api.ipify.org;" always;

    # ─── Yii2 PHP API ────────────────────────────────────────────────────────
    # Maps: /course-reserves/backend/web/ACTION → backend:80/ACTION
    # Apache DocumentRoot is /app/web, so it receives /ACTION correctly.
    location /course-reserves/backend/web/ {
        rewrite            ^/course-reserves/backend/web/(.*)$ /$1 break;
        proxy_pass         $backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── PHP Auth endpoints ───────────────────────────────────────────────────
    # Maps: /course-reserves/backend/admin/SCRIPT → backend:80/admin/SCRIPT
    # Apache has an Alias: /admin → /app/admin so scripts are served directly.
    location /course-reserves/backend/admin/ {
        # Rate limit: 5 req/min per IP, burst of 3, no queuing
        limit_req zone=auth burst=3 nodelay;
        limit_req_status 429;

        rewrite ^/course-reserves/backend/admin/(.*)$ /admin/$1 break;
        proxy_pass         $backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ─── FOLIO proxy (development-only fake/real switch) ─────────────────────
    location = /folio/web/search/search-courses {
        include /etc/nginx/folio-cors.conf;

        proxy_pass         $folio_proxy;
        proxy_set_header   Host              $folio_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_read_timeout 30s;
    }

    location /folio/web/ {
        include /etc/nginx/folio-cors.conf;

        proxy_pass         $folio_proxy;
        proxy_set_header   Host              $folio_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_read_timeout 30s;
    }

    location ^~ /_fake-folio/ {
        if ($folio_mode != "fake") {
            return 404;
        }

        proxy_pass         $fake_folio_upstream;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ─── Faculty form dev server ──────────────────────────────────────────────
    # The request path, including /form/, is passed through to Vite.
    location /form/ {
        proxy_pass         $faculty_form_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # WebSocket support for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ─── Vite frontend (everything else) ─────────────────────────────────────
    # Note: HMR WebSocket connects directly to localhost:5173, so the
    # developer opens http://localhost:5173 for dev work with HMR.
    # This block handles cases where the full-stack URL (port 8080) is used.
    location / {
        proxy_pass         $frontend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # WebSocket support for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
