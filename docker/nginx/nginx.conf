# Rate limiting zone for auth endpoints (5 req/min per IP, burst of 3)
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

map $http_origin $folio_cors_origin {
    default "";
    "http://localhost:5173" "http://localhost:5173";
    "http://localhost:5174" "http://localhost:5174";
    "http://127.0.0.1:5173" "http://127.0.0.1:5173";
    "http://127.0.0.1:5174" "http://127.0.0.1:5174";
    "http://localhost:8080" "http://localhost:8080";
}

server {
    listen 80;
    server_name localhost;

    # ─── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://kit.fontawesome.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://kit.fontawesome.com https://ka-f.fontawesome.com; connect-src 'self' ws://localhost:5173 ws://localhost:5174 https://api.ipify.org;" always;

    # ─── Yii2 PHP API ────────────────────────────────────────────────────────
    # Maps: /course-reserves/backend/web/ACTION → backend:80/ACTION
    # Apache DocumentRoot is /app/web, so it receives /ACTION correctly.
    location /course-reserves/backend/web/ {
        proxy_pass         http://backend/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── PHP Auth endpoints ───────────────────────────────────────────────────
    # Maps: /course-reserves/backend/admin/SCRIPT → backend:80/admin/SCRIPT
    # Apache has an Alias: /admin → /app/admin so scripts are served directly.
    location /course-reserves/backend/admin/ {
        # Rate limit: 5 req/min per IP, burst of 3, no queuing
        limit_req zone=auth burst=3 nodelay;
        limit_req_status 429;

        rewrite ^/course-reserves/backend/admin/(.*)$ /admin/$1 break;
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ─── FOLIO proxy (forwards to production) ────────────────────────────────
    # The FOLIO service is a separate app on the production server; we proxy
    # through rather than mocking, since FOLIO data is read-only.
    location = /folio/web/search/search-courses {
        include /etc/nginx/folio-cors.conf;

        error_page 418 = @sandbox_folio_search_courses;
        if ($arg_query ~* "(sandbox-folio-course-001|TST([[:space:]]|%20|\\+)*101|Sandbox([[:space:]]|%20|\\+)+Course([[:space:]]|%20|\\+)+Reserves([[:space:]]|%20|\\+)+Workflow)") {
            return 418;
        }

        proxy_pass         https://libtools2.smith.edu/folio/web/search/search-courses;
        proxy_set_header   Host              libtools2.smith.edu;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_read_timeout 30s;
    }

    location @sandbox_folio_search_courses {
        include /etc/nginx/folio-cors.conf;

        rewrite ^ /sandbox-folio/search-courses break;
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /folio/web/ {
        include /etc/nginx/folio-cors.conf;

        proxy_pass         https://libtools2.smith.edu/folio/web/;
        proxy_set_header   Host              libtools2.smith.edu;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_read_timeout 30s;
    }

    # ─── Faculty form dev server ──────────────────────────────────────────────
    # Maps: /form/ → faculty-form:5174/
    # The trailing slash on proxy_pass strips the /form/ prefix so Vite sees
    # paths rooted at /.
    location /form/ {
        proxy_pass         http://faculty-form:5174;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # WebSocket support for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ─── Vite frontend (everything else) ─────────────────────────────────────
    # Note: HMR WebSocket connects directly to localhost:5173, so the
    # developer opens http://localhost:5173 for dev work with HMR.
    # This block handles cases where the full-stack URL (port 8080) is used.
    location / {
        proxy_pass         http://frontend:5173;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # WebSocket support for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
