<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /app/web

    # Yii2 API — requests arrive at / after nginx strips the prefix
    <Directory /app/web>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Auth scripts (authorize-local.php, refresh-token-local.php, etc.)
    # nginx rewrites /course-reserves/backend/admin/X → /admin/X
    Alias /admin /app/admin
    <Directory /app/admin>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Pass DB connection vars from Docker environment into PHP.
    # PassEnv reads the real process environment (set by Docker Compose),
    # unlike SetEnv which only accepts literal strings.
    PassEnv DB_HOST DB_NAME DB_USER DB_PASS

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
