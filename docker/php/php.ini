; PHP development settings for local Docker environment

[PHP]
; Error reporting — show everything locally
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/log/apache2/php_errors.log

; Memory — generous for Yii2 + EBSCO API responses
memory_limit = 256M

; Timeouts
max_execution_time = 120
max_input_time = 120

; Upload limits (if needed for resource attachments)
upload_max_filesize = 32M
post_max_size = 32M

; Date
date.timezone = America/New_York

; OPcache — disable for dev so code changes are reflected immediately
[opcache]
opcache.enable = 0
opcache.enable_cli = 0
